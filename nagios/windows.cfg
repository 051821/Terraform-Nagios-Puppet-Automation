define host {
    use                 generic-host
    host_name           win-agent
    alias               Windows Machine
    address             192.168.241.1
    max_check_attempts  5
}


define service {
    use                       generic-service
    host_name                 win-agent
    service_description       PING Check
    check_command             check_ping!100.0,20%!500.0,60%
}
